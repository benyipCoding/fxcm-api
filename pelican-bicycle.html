<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3e9">
  <title>顺风，慢行。｜鹈鹕的海岸骑行</title>
  <style>
    :root { color-scheme: light; --paper: #f6f3e9; --ink: #233f3d; --muted: #78877b; --orange: #d9683d; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button { font: inherit; }
    .page { max-width: 1600px; margin: auto; padding: 28px 5.5vw 22px; min-height: 100svh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 650; font-size: 12px; letter-spacing: 2px; }
    .brand svg { width: 35px; height: 35px; }
    .issue { color: var(--muted); font-size: 10px; letter-spacing: 2px; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .heading { text-align: center; padding-top: 36px; position: relative; z-index: 1; }
    .eyebrow { margin: 0 0 13px; color: var(--orange); font-size: 10px; font-weight: 650; letter-spacing: 4px; }
    h1 { margin: 0; font-family: "Songti SC", "STSong", "SimSun", serif; font-size: clamp(35px, 4vw, 56px); font-weight: 500; letter-spacing: 7px; }
    .subtitle { margin: 15px 0 0; font-size: 12px; color: var(--muted); letter-spacing: 2px; line-height: 1.8; }
    figure { margin: -35px -3vw -20px; }
    #scene { display: block; width: 100%; max-height: 66vh; min-height: 300px; overflow: hidden; }
    .dashboard { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin: 0 auto 32px; width: min(100%, 920px); }
    .note { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11px; letter-spacing: 1px; }
    .note svg { width: 26px; height: 26px; }
    .controls { display: flex; align-items: center; gap: 17px; }
    .speeds { display: flex; border: 1px solid #dcded2; border-radius: 30px; padding: 4px; gap: 3px; }
    .speeds button { border: 0; border-radius: 24px; padding: 8px 14px; background: transparent; color: var(--muted); font-size: 11px; cursor: pointer; transition: background .2s, color .2s; }
    .speeds button[aria-pressed="true"] { color: #fffaf0; background: var(--ink); }
    .pause { display: flex; align-items: center; gap: 8px; padding: 8px 0 8px 8px; border: 0; background: transparent; color: var(--ink); cursor: pointer; font-size: 11px; min-width: 69px; }
    .pause svg { width: 25px; height: 25px; }
    button:focus-visible { outline: 2px solid var(--orange); outline-offset: 5px; }
    button:hover { filter: brightness(.88); }
    footer { border-top: 1px solid #dfe1d6; padding-top: 17px; display: flex; justify-content: space-between; align-items: center; gap: 20px; font-size: 9px; letter-spacing: 2px; color: #899184; }
    .status { display: flex; align-items: center; gap: 7px; }
    .status::before { content: ""; width: 5px; height: 5px; background: #739384; border-radius: 50%; }
    .outline { stroke: #2d4945; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .round { stroke-linecap: round; stroke-linejoin: round; }
    @media (min-width: 1600px) { .page { padding-left: 88px; padding-right: 88px; } }
    @media (max-width: 640px) {
      .page { padding: 23px 22px 19px; }
      .brand { font-size: 10px; letter-spacing: 1px; gap: 7px; }
      .brand svg { width: 29px; height: 29px; }
      .issue { font-size: 8px; letter-spacing: 1px; }
      .heading { padding-top: 48px; }
      .eyebrow { font-size: 8px; letter-spacing: 2.6px; }
      h1 { letter-spacing: 4px; }
      .subtitle { font-size: 10px; letter-spacing: 1px; }
      figure { margin: 0 -22px 15px; overflow: hidden; }
      #scene { width: 150%; margin-left: -25%; min-height: 0; max-height: none; }
      .dashboard { flex-direction: column; gap: 21px; margin-bottom: 35px; }
      .note { font-size: 10px; }
      .controls { gap: 24px; }
      footer { font-size: 8px; letter-spacing: .8px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="20" cy="20" r="18" stroke="#b5bdae"/>
          <path d="M10 27c9 2 13-3 13-10 0-5 6-7 8-3l-1 4 6 2-9 3c-2 7-9 9-17 4Z" fill="#e4e9d9" stroke="#34584c" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M29 17l7 3-9 1" fill="#eab365" stroke="#34584c" stroke-width="1.2"/>
          <circle cx="28" cy="15.4" r="1" fill="#34584c"/>
        </svg>
        <span>海岸漫游社</span>
      </div>
      <span class="issue">THE SLOW CLUB · VOL. 01</span>
    </header>

    <main>
      <div class="heading">
        <p class="eyebrow">LESS HURRY, MORE BREEZE</p>
        <h1>顺风，慢行。</h1>
        <p class="subtitle">把烦恼留在身后，把海风装进口袋。</p>
      </div>

      <figure aria-label="一只戴着小帽子、系着绿色围巾的鹈鹕，骑自行车沿海岸悠闲前行。">
        <svg id="scene" viewBox="0 0 1200 720" role="img" aria-labelledby="scene-title scene-description">
          <title id="scene-title">鹈鹕的海岸骑行</title>
          <desc id="scene-description">白色鹈鹕有一张长长的金黄色嘴巴和鼓起的喉囊，正踩动橘红色自行车的踏板。车轮旋转，围巾飘动，海岸草木向后移动。下方可暂停动画或调整速度。</desc>

              <path d="M438 516L541 397 585 506 438 516M541 397H726L585 506M531 371L585 506M765 516L714 358" stroke="#dc754c" stroke-width="6.5"/>
              <path d="M556 399H699M450 511L532 415" stroke="#f4ac77" stroke-width="2"/>
              <path d="M533 378l-7-21" stroke="#6f8173" stroke-width="6"/>

              <path d="M438 509l147-17a14 14 0 0 1 0 28l-147 4a8 8 0 0 1 0-15Z" stroke="#566d60" stroke-width="2.5"/>
            </g>

            <path d="M505 361h34" stroke="#c6996f" stroke-width="2" class="round"/>
            <circle cx="585" cy="506" r="21" fill="#eee5cc" stroke="#2d4945" stroke-width="3"/>
            <circle cx="585" cy="506" r="14" fill="#849b87" stroke="#4a685a" stroke-width="2"/>

            </g>

          <!-- Long beak, deep throat pouch, and folded wing give the bird its silhouette. -->

            <path d="M674 202C721 201 797 213 845 223q16 5 4 10L678 221Z" fill="#f3c16b" class="outline"/>
            <path d="M695 208q81 3 137 17" fill="none" stroke="#ffe1a1" stroke-width="3" class="round"/>
            <path d="M680 218l150 10" fill="none" stroke="#b9813e" stroke-width="1.4" class="round"/>
            <ellipse cx="657" cy="208" rx="10" ry="12" fill="#f4edd9"/>
            <g id="eye" transform="translate(658 207)">
              <ellipse rx="4" ry="5.5" fill="#29433e"/>
              <circle cx="1.2" cy="-1.8" r="1.4" fill="#fffdf1"/>
            </g>
            <path d="M649 192q7-4 12 1" fill="none" stroke="#456356" stroke-width="2.3" class="round"/>
            <ellipse cx="650" cy="226" rx="8" ry="4.3" fill="#eec2a1" opacity=".65"/>
            <path id="scarf-tail" d="M607 263C575 245 555 258 526 243L523 259C551 277 577 261 603 279Z" fill="#64907c" class="outline"/>

            <path d="M610 262l-2 8m10-6-1 9m10-9v8" stroke="#c2d0a3" stroke-width="3"/>

      <div class="dashboard">

          <span>今日计划：骑到风停下来的地方。</span>

            <button type="button" data-speed="0.65" aria-pressed="false">兜风</button>
            <button type="button" data-speed="1" aria-pressed="true">慢骑</button>

    <footer>
      <span>A SMALL ESCAPE, ON TWO WHEELS.</span>
      <span class="status">海风正好 · 不必赶路</span>

  </div>

  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const elements = Object.fromEntries([
        'rear-spokes', 'front-spokes', 'far-crank', 'near-crank', 'far-leg',
        'near-leg', 'near-leg-color', 'far-foot', 'near-foot', 'pelican',
        'scarf-tail', 'eye', 'road-dashes', 'sand-grain', 'roadside', 'ripples',
        'cloud-one', 'cloud-two', 'cloud-three', 'gull-one', 'gull-two',
        'breeze-one', 'breeze-two', 'shadow'
      ].map(id => [id, byId(id)]));
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !motionPreference.matches;
      let speed = 1;
      let time = 0;
      let previous = null;
      let frameId = null;
      const tau = Math.PI * 2;

      function transform(id, value) { elements[id].setAttribute('transform', value); }

      // Solve a two-segment leg so its foot always meets the pedal.
      function legPath(hip, foot, thigh, shin) {
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.max(.001, Math.hypot(dx, dy));
        const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, thigh * thigh - along * along));
        const kneeX = hip.x + along * dx / distance + bend * dy / distance;
        const kneeY = hip.y + along * dy / distance - bend * dx / distance;
        return `M${hip.x} ${hip.y}L${kneeX} ${kneeY} ${foot.x} ${foot.y}`;
      }

      function draw() {
        const crank = time * tau / 1.85;
        const degrees = crank * 180 / Math.PI;
        const bob = Math.sin(crank * 2) * 1.6;
        const distance = crank * 91 * 1.55;
        const near = { x: 585 + Math.cos(crank) * 35, y: 506 + Math.sin(crank) * 35 };
        const far = { x: 585 - Math.cos(crank) * 35, y: 506 - Math.sin(crank) * 35 };
        transform('rear-spokes', `rotate(${degrees * 1.55 % 360})`);
        transform('front-spokes', `rotate(${degrees * 1.55 % 360})`);
        transform('near-crank', `translate(585 506) rotate(${degrees % 360})`);
        transform('far-crank', `translate(585 506) rotate(${degrees % 360})`);
        transform('near-foot', `translate(${near.x} ${near.y})`);
        transform('far-foot', `translate(${far.x} ${far.y})`);
        const nearPath = legPath({ x: 548, y: 358 + bob }, near, 91, 103);
        elements['near-leg'].setAttribute('d', nearPath);
        elements['near-leg-color'].setAttribute('d', nearPath);
        elements['far-leg'].setAttribute('d', legPath({ x: 531, y: 354 + bob }, far, 96, 103));
        transform('pelican', `translate(0 ${bob})`);

        const flutter = Math.sin(time * 6) * 7;
        elements['scarf-tail'].setAttribute('d', `M607 263C575 ${245 + flutter} 555 ${258 - flutter} 526 ${243 + flutter}L523 ${259 + flutter}C551 ${277 - flutter} 577 ${261 + flutter} 603 279Z`);
        const blinkPhase = time % 4.9;
        const eyeScale = blinkPhase > 4.65 ? Math.max(.08, Math.abs(blinkPhase - 4.775) / .125) : 1;
        transform('eye', `translate(658 207) scale(1 ${eyeScale})`);

        elements['road-dashes'].setAttribute('patternTransform', `translate(${-distance % 240} 0)`);
        elements['sand-grain'].setAttribute('patternTransform', `translate(${-distance % 173} 0)`);
        transform('roadside', `translate(${-distance % 1200} 0)`);
        transform('ripples', `translate(${Math.sin(time * .3) * 13} 0)`);
        transform('cloud-one', `translate(${Math.sin(time * .12) * 30} 0)`);
        transform('cloud-two', `translate(${Math.sin(time * .1 + 1) * 25} 0)`);
        transform('cloud-three', `translate(${Math.sin(time * .14 + 2) * 18} 0)`);
        const flap = Math.sin(time * 3) * 6;
        elements['gull-one'].setAttribute('d', `M359 256q10 ${-10 + flap} 20 0 10 ${-10 + flap} 20 0`);
        elements['gull-two'].setAttribute('d', `M1000 342q8 ${-7 - flap * .6} 16 0 8 ${-7 - flap * .6} 16 0`);
        transform('breeze-one', `translate(${-8 * Math.sin(time * 2)} 0)`);
        transform('breeze-two', `translate(${-10 * Math.sin(time * 2 + 1)} 0)`);
        elements.shadow.setAttribute('rx', 224 + bob);
      }

      function tick(now) {
        frameId = null;
        if (!playing || document.hidden) { previous = null; return; }
        if (previous !== null) time += Math.min((now - previous) / 1000, .05) * speed;
        previous = now;
        draw();
        frameId = requestAnimationFrame(tick);
      }

      function schedule() {
        if (playing && !document.hidden && frameId === null) {
          previous = null;
          frameId = requestAnimationFrame(tick);
        }
      }

      function updatePlayback() {
        byId('pause-label').textContent = playing ? '暂停' : '播放';
        byId('pause').setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        byId('pause-icon').setAttribute('d', playing ? 'M11 9v10m6-10v10' : 'M11 9l8 5-8 5Z');
        if (!playing && frameId !== null) {
          cancelAnimationFrame(frameId);
          frameId = null;
          previous = null;
        }
        schedule();
      }

      byId('pause').addEventListener('click', () => {
        playing = !playing;
        updatePlayback();
      });
      document.querySelectorAll('[data-speed]').forEach(button => {
        button.addEventListener('click', () => {
          speed = Number(button.dataset.speed);
          document.querySelectorAll('[data-speed]').forEach(item => {
            item.setAttribute('aria-pressed', String(item === button));
          });
        });
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && frameId !== null) {
          cancelAnimationFrame(frameId);
          frameId = null;
          previous = null;
        } else schedule();
      });
      motionPreference.addEventListener('change', event => {
        playing = !event.matches;
        updatePlayback();
      });
      draw();
      updatePlayback();
    })();
  </script>
</body>
</html>
