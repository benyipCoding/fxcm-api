<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f5ed">
  <title>慢慢骑，去看海 · Pelican on a Bicycle</title>
  <style>
    :root { color-scheme: light; --paper: #f8f5ed; --ink: #294843; --muted: #89918a; --green: #3d776a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button { font: inherit; }
    .page { max-width: 1440px; min-height: 100svh; margin: 0 auto; padding: 31px 5.5vw 24px; display: flex; flex-direction: column; }
    .masthead { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 12px; font-weight: 650; letter-spacing: 2px; }
    .brand svg { width: 33px; height: 33px; }
    .edition { font-size: 10px; letter-spacing: 2.5px; color: var(--muted); }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .intro { text-align: center; padding-top: 39px; position: relative; z-index: 1; }
    .eyebrow { margin: 0 0 16px; color: var(--green); font-size: 10px; font-weight: 600; letter-spacing: 4px; }
    h1 { margin: 0; font-family: "Songti SC", "STSong", "SimSun", serif; font-size: clamp(30px, 3.5vw, 49px); font-weight: 500; letter-spacing: 5px; }
    .subtitle { margin: 17px 0 0; color: #8a9188; font-size: 12px; letter-spacing: 2px; }
    .scene { margin: -29px -3.2vw -14px; position: relative; }
    .scene > svg { display: block; width: 100%; height: auto; overflow: hidden; }
    .controls { width: min(100%, 940px); margin: 0 auto 25px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .caption { display: flex; align-items: center; gap: 12px; font-size: 12px; letter-spacing: 1.4px; color: #7c887e; }
    .caption::before { content: ""; display: block; width: 26px; height: 1px; background: #a4b2a2; }
    .actions { display: flex; align-items: center; gap: 19px; }
    .speed { display: flex; gap: 3px; border: 1px solid #dfe3d8; border-radius: 25px; padding: 4px; }
    .speed button { border: 0; border-radius: 20px; background: transparent; color: #869087; padding: 6px 13px; cursor: pointer; font-size: 11px; letter-spacing: 1px; transition: background .2s, color .2s; }
    .speed button[aria-pressed="true"] { background: #e4ebdf; color: #456c59; }
    .toggle { display: flex; align-items: center; gap: 8px; color: #627b6d; background: transparent; border: 0; cursor: pointer; padding: 8px 0 8px 8px; font-size: 11px; letter-spacing: 1px; }
    .toggle svg { width: 27px; height: 27px; }
    button:focus-visible { outline: 2px solid #3d776a; outline-offset: 4px; }
    button:hover { color: #294843; }
    footer { border-top: 1px solid #e5e5da; padding-top: 18px; display: flex; justify-content: space-between; gap: 15px; font-size: 9px; color: #9a9f94; letter-spacing: 2px; }
    .footer-right { display: flex; align-items: center; gap: 7px; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: #91a98b; }
    .ink { stroke: #314f49; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
    .fine { stroke-linecap: round; stroke-linejoin: round; }
    @media (min-width: 1450px) { .page { padding-left: 78px; padding-right: 78px; } .scene { margin-left: -45px; margin-right: -45px; } }
    @media (max-width: 600px) {
      .page { padding: 23px 22px 20px; }
      .brand { font-size: 10px; letter-spacing: 1px; gap: 7px; }
      .brand svg { width: 28px; height: 28px; }
      .edition { font-size: 8px; letter-spacing: 1px; }
      .intro { padding-top: 56px; }
      h1 { letter-spacing: 2px; }
      .eyebrow { font-size: 8px; letter-spacing: 2.5px; }
      .subtitle { font-size: 10px; letter-spacing: 1px; }
      .scene { margin: 5px -22px 16px; overflow: hidden; }
      .scene > svg { width: 155%; max-width: none; margin-left: -27.5%; }
      .controls { flex-direction: column; gap: 24px; margin-bottom: 40px; }
      .caption { font-size: 10px; }
      .actions { gap: 25px; }
      footer { font-size: 7px; letter-spacing: 1px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="brand">

            <path d="M462 482 588 489Q605 484 600 473L590 465 465 470" stroke="#7b8871" stroke-width="2"/>

  <script>
    (() => {
      'use strict';
      const get = id => document.getElementById(id);
      const elements = Object.fromEntries([
        'rear-wheel', 'front-wheel', 'pelican', 'pelican-eye', 'scarf-tail',
        'scarf-stripe', 'road-marks', 'road-grain', 'roadside-a', 'roadside-b',
        'cloud-a', 'cloud-b', 'cloud-c', 'sea-ripples', 'distant-gull',
        'gull-wings', 'bike-shadow', 'wind', 'foreground',
        'near-leg', 'near-leg-outline', 'far-leg', 'far-leg-outline',
        'near-crank', 'near-crank-shine', 'far-crank', 'near-foot', 'far-foot'
      ].map(id => [id, get(id)]));
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !motionPreference.matches;
      let speed = 1;
      let elapsed = 0;
      let previous = null;
      let requestId = null;
      const tau = Math.PI * 2;
      const set = (id, name, value) => elements[id].setAttribute(name, value);

      // Inverse kinematics keep both feet attached to opposite crank arms.
      function drawLeg(side, phase, bob) {
        const hip = { x: side === 'near' ? 584 : 568, y: 326 + bob };
        const pedal = { x: 590 + Math.cos(phase) * 29, y: 476 + Math.sin(phase) * 29 };
        const ankle = { x: pedal.x, y: pedal.y - 5 };
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const upper = 94;
        const lower = 92;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = {
          x: hip.x + along * dx / distance + bend * dy / distance,
          y: hip.y + along * dy / distance - bend * dx / distance
        };
        const path = `M${hip.x} ${hip.y} L${knee.x} ${knee.y} L${ankle.x} ${ankle.y}`;
        set(`${side}-leg`, 'd', path);
        set(`${side}-leg-outline`, 'd', path);
        const crank = `M590 476 L${pedal.x} ${pedal.y}`;
        set(`${side}-crank`, 'd', crank);
        if (side === 'near') set('near-crank-shine', 'd', crank);
        set(`${side}-foot`, 'transform', `translate(${pedal.x} ${pedal.y})`);
      }

      function render(time) {
        const phase = time * 3.5;
        const bob = Math.sin(phase * 2) * 2.1;
        const travel = time * 155;
        const turn = (travel / 78 * 180 / Math.PI) % 360;
        set('rear-wheel', 'transform', `rotate(${turn})`);
        set('front-wheel', 'transform', `rotate(${turn})`);
        set('pelican', 'transform', `translate(0 ${bob})`);
        drawLeg('far', phase + Math.PI, bob);
        drawLeg('near', phase, bob);

        const flutter = Math.sin(phase * 1.7) * 5;
        const flutter2 = Math.sin(phase * 1.7 - 1) * 4;
        set('scarf-tail', 'd', `M626 212Q598 211 576 ${196 + flutter2}T529 ${200 + flutter}L539 ${213 + flutter} 529 ${222 + flutter}Q560 ${211 + flutter2} 578 ${221 + flutter2}T625 224Z`);
        set('scarf-stripe', 'd', `M617 217Q595 215 575 ${206 + flutter2}T541 ${208 + flutter}`);
        const blinkCycle = time % 5.4;
        const eyeScale = blinkCycle > 5.15 ? Math.max(.07, Math.abs(blinkCycle - 5.275) / .125) : 1;
        set('pelican-eye', 'transform', `translate(665 153) scale(1 ${eyeScale})`);

        set('road-marks', 'patternTransform', `translate(${-travel % 195} 0)`);
        set('road-grain', 'patternTransform', `translate(${-travel % 160} 0)`);
        set('roadside-a', 'transform', `translate(${-((travel * .9 + 1050) % 1400) + 1050} 0)`);
        set('roadside-b', 'transform', `translate(${-((travel * .9 + 170) % 1400) + 170} 0)`);
        set('foreground', 'transform', `translate(${-((travel * 1.15 + 80) % 1400) + 80} 0)`);
        set('cloud-a', 'transform', `translate(${-((time * 8 + 800) % 1500) + 800} 0)`);
        set('cloud-b', 'transform', `translate(${-((time * 5 + 250) % 1500) + 250} 0)`);
        set('cloud-c', 'transform', `translate(${-((time * 6 + 200) % 1500) + 200} 0)`);
        set('sea-ripples', 'transform', `translate(${Math.sin(time * .45) * 9} ${Math.sin(time * .8) * 1.2})`);
        set('distant-gull', 'transform', `translate(${Math.sin(time * .25) * 35} ${Math.sin(time * .8) * 6})`);
        const flap = Math.sin(time * 2.6) * 5 - 5;
        set('gull-wings', 'd', `M356 ${199 + flap}Q366 ${194 + flap} 376 199Q386 ${194 + flap} 396 ${199 + flap}`);
        set('bike-shadow', 'rx', 215 + bob * 1.3);
        set('wind', 'opacity', .35 + (Math.sin(time * 2) + 1) * .15);
        set('wind', 'transform', `translate(${-Math.sin(time * 2) * 6} 0)`);
      }

      function tick(now) {
        requestId = null;
        if (!playing || document.hidden) return;
        if (previous !== null) elapsed += Math.min((now - previous) / 1000, .05) * speed;
        previous = now;
        render(elapsed);
        requestId = requestAnimationFrame(tick);
      }

      function synchronizePlayback() {
        if (requestId !== null) cancelAnimationFrame(requestId);
        requestId = null;
        previous = null;
        get('toggle').setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        get('toggle-label').textContent = playing ? '歇一会儿' : '继续出发';
        get('toggle-icon').setAttribute('d', playing ? 'M11 10v8M17 10v8' : 'M11 9l8 5-8 5Z');
        if (playing && !document.hidden) requestId = requestAnimationFrame(tick);
      }

      get('toggle').addEventListener('click', () => {
        playing = !playing;
        synchronizePlayback();
      });
      document.querySelectorAll('[data-speed]').forEach(button => {
        button.addEventListener('click', () => {
          speed = Number(button.dataset.speed);
          document.querySelectorAll('[data-speed]').forEach(option => {
            option.setAttribute('aria-pressed', String(option === button));
          });
        });
      });
      document.addEventListener('visibilitychange', synchronizePlayback);
      motionPreference.addEventListener('change', event => {
        playing = !event.matches;
        synchronizePlayback();
      });
      render(0);
      synchronizePlayback();
    })();
  </script>
</body>
</html>
